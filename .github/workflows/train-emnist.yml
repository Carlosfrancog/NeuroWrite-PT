name: Treinar modelos - EMNIST publico

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/train-emnist.yml"
      - "notebooks/01_EMNIST_publico.ipynb"
      - "requirements.txt"

permissions:
  contents: read

concurrency:
  group: neurowrite-emnist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  treinar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jupyter nbconvert ipykernel joblib

      - name: Executar treinamento e salvar notebook com saidas
        run: |
          mkdir -p results
          jupyter nbconvert notebooks/01_EMNIST_publico.ipynb \
            --to notebook --execute \
            --output 01_EMNIST_publico_EXECUTADO.ipynb \
            --output-dir results \
            --ExecutePreprocessor.timeout=1500 \
            --ExecutePreprocessor.kernel_name=python3

      - name: Verificar resultados produzidos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          notebook = Path("results/01_EMNIST_publico_EXECUTADO.ipynb")
          relatorio = Path("results/emnist/metricas.csv")
          assert notebook.exists() and relatorio.exists()
          dados = json.loads(notebook.read_text(encoding="utf-8"))
          codigos = [c for c in dados["cells"] if c["cell_type"] == "code"]
          assert len(codigos) >= 3
          assert all(c.get("execution_count") is not None for c in codigos)
          assert all(not any(output.get("output_type") == "error" for output in c.get("outputs", [])) for c in codigos)
          resultados = pd.read_csv(relatorio)
          assert set(resultados["modelo"]) == {"SVM", "MLP"}
          assert resultados["acuracia"].between(0, 1).all()
          assert resultados["f1_macro"].between(0, 1).all()
          print(resultados.to_string(index=False))
          PY

      - name: Publicar notebook executado, graficos e modelos
        uses: actions/upload-artifact@v4
        with:
          name: NeuroWrite-EMNIST-Resultados-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 14
