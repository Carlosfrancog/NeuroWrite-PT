name: Treinar modelos - EMNIST publico

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/train-emnist.yml"
      - "notebooks/01_EMNIST_publico.ipynb"
      - "requirements.txt"
      - "src/**"
      - "scripts/run_online_emnist.py"
      - "scripts/evaluate_handwriting_online.py"
      - "tests/test_online_training.py"

permissions:
  contents: read

concurrency:
  group: neurowrite-emnist-${{ github.ref }}
  cancel-in-progress: true

jobs:
  treinar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Obter codigo
        uses: actions/checkout@v6

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt jupyter nbconvert ipykernel joblib

      - name: Executar treinamento e salvar notebook com saidas
        run: |
          mkdir -p results
          jupyter nbconvert notebooks/01_EMNIST_publico.ipynb \
            --to notebook --execute \
            --output 01_EMNIST_publico_EXECUTADO.ipynb \
            --output-dir results \
            --ExecutePreprocessor.timeout=1500 \
            --ExecutePreprocessor.kernel_name=python3
          # O nbconvert executa o kernel a partir da pasta notebooks/.
          # Os artefatos produzidos nas celulas ficam nesse diretório.
          if [ -d notebooks/results/emnist ]; then
            mkdir -p results/emnist
            cp -a notebooks/results/emnist/. results/emnist/
          fi
          echo "Arquivos gerados:"
          find results -maxdepth 3 -type f -print

      - name: Verificar resultados produzidos
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          notebook = Path("results/01_EMNIST_publico_EXECUTADO.ipynb")
          relatorio = Path("results/emnist/metricas.csv")
          assert notebook.exists() and relatorio.exists()
          dados = json.loads(notebook.read_text(encoding="utf-8"))
          codigos = [c for c in dados["cells"] if c["cell_type"] == "code"]
          assert len(codigos) >= 3
          assert all(c.get("execution_count") is not None for c in codigos)
          assert all(not any(output.get("output_type") == "error" for output in c.get("outputs", [])) for c in codigos)
          resultados = pd.read_csv(relatorio)
          assert set(resultados["modelo"]) == {"SVM", "MLP"}
          assert resultados["acuracia"].between(0, 1).all()
          assert resultados["f1_macro"].between(0, 1).all()
          print(resultados.to_string(index=False))
          PY

      - name: Testar letra manuscrita enviada pelo grupo (sem retreino)
        run: |
          python scripts/evaluate_handwriting.py \
            --fixture tests/fixtures/linha_caderno_mask.b64 \
            --models-dir results/emnist \
            --output-dir results/handwriting
          test -s results/handwriting/resumo_diagnostico.csv
          test -s results/handwriting/recortes_conferidos.png

      - name: Testar gerador, ciclo incremental e topologia real
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Comparar MLP incremental com e sem augmentacao
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          python -m scripts.run_online_emnist
          test -s results/online/historico_por_epoca.csv
          test -s results/online/rede_real_completa.png
          test -s results/online/rede_real_metadados.json
          test -s results/online/rede_grande_filtrada.png
          test -s results/online/rede_compacta_saida_AZ.png
          test -s results/online/evolucao_pesos_por_epoca.gif
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          tabela = pd.read_csv("results/online/comparacao_teste.csv")
          assert set(tabela["modelo"]) == {"com_augmentacao", "sem_augmentacao"}
          assert tabela["f1_macro_teste"].between(0, 1).all()
          meta = json.loads(Path("results/online/rede_real_metadados.json").read_text())
          assert meta["topologia"] == [784, 128, 26]
          assert meta["total_pesos"] == 103680
          print(tabela.to_string(index=False))
          print("Camadas reais:", meta["topologia"])
          PY

      - name: Avaliar as 26 letras manuscritas A-Z na MLP incremental (sem retreinar)
        run: |
          python -m scripts.evaluate_handwriting_online \
            --fixture tests/fixtures/linha_caderno_mask.b64 \
            --modelo results/online/com_augmentacao.joblib \
            --output-dir results/handwriting
          test -s results/handwriting/predicoes_mlp_incremental_AZ.csv
          test -s results/handwriting/letras_mlp_incremental_AZ.png
          python - <<'PY'
          import pandas as pd
          df = pd.read_csv("results/handwriting/predicoes_mlp_incremental_AZ.csv")
          assert len(df) == 26 and set(df["esperado"]) == set("ABCDEFGHIJKLMNOPQRSTUVWXYZ")
          assert df["confianca"].between(0, 1).all()
          PY

      - name: Publicar notebook executado, graficos e modelos
        uses: actions/upload-artifact@v6
        with:
          name: NeuroWrite-EMNIST-Resultados-${{ github.run_number }}
          path: results/
          if-no-files-found: error
          retention-days: 14

      # Artifacts individuais não compactados: aparecem com prévia no navegador,
      # além do pacote ZIP original, sem publicar arquivos de fotos pessoais.
      - name: Publicar imagem da rede grande (PNG)
        id: rede_grande
        uses: actions/upload-artifact@v7
        with:
          path: results/online/rede_grande_filtrada.png
          archive: false
          retention-days: 14

      - name: Publicar imagem da rede compacta (PNG)
        id: rede_compacta
        uses: actions/upload-artifact@v7
        with:
          path: results/online/rede_compacta_saida_AZ.png
          archive: false
          retention-days: 14

      - name: Publicar animacao dos checkpoints (GIF)
        id: gif_treino
        uses: actions/upload-artifact@v7
        with:
          path: results/online/evolucao_pesos_por_epoca.gif
          archive: false
          retention-days: 14

      - name: Publicar teste da caligrafia A-Z (PNG)
        id: img_caderno
        uses: actions/upload-artifact@v7
        with:
          path: results/handwriting/letras_mlp_incremental_AZ.png
          archive: false
          retention-days: 14

      - name: Resumo com links individuais para as imagens
        if: success()
        env:
          GRANDE: ${{ steps.rede_grande.outputs.artifact-url }}
          COMPACTA: ${{ steps.rede_compacta.outputs.artifact-url }}
          GIF: ${{ steps.gif_treino.outputs.artifact-url }}
          CADERNO: ${{ steps.img_caderno.outputs.artifact-url }}
        run: |
          {
            echo "## NeuroWrite — visualizações e caligrafia A–Z"
            echo ""
            echo "Arquivos clicáveis na própria Action, além do ZIP completo:"
            echo ""
            echo "- [Rede grande filtrada (PNG)]($GRANDE)"
            echo "- [Rede compacta e 26 probabilidades (PNG)]($COMPACTA)"
            echo "- [Evolução real dos pesos por época (GIF)]($GIF)"
            echo "- [Diagnóstico da caligrafia do grupo: 26 letras, sem acentos (PNG)]($CADERNO)"
            echo ""
            echo "Os pesos são reais; arestas são filtradas para legibilidade."
            echo "O GIF mostra checkpoints entre épocas, não gradientes quadro a quadro."
            echo "Amostra A–Z serve apenas como diagnóstico; não houve retreinamento nela."
          } >> "$GITHUB_STEP_SUMMARY"
